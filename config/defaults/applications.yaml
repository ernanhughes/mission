  - id: bookbuilder
    name: BookBuilder
    description: Reproducible EPUB and PDF artifacts from Markdown chapters via Pandoc.
    category: publishing
    icon: "B"
    tags: [publishing, epub, pdf]
    enabled: true
    pinned: false
    display_order: 60
    repository_path: 'C:\Projects\bookbuilder'
    documentation_paths:
      - 'C:\Projects\bookbuilder\README.md'
    integration:
      adapter: null
      enabled: false
      config: {}
    relationships:
      projects: [language, inference, math]
      outcomes: [books, programmer-ie]
    control_policy:
      allow_launch: true
      confirmation_required: true
    launch_definitions:
      - id: bookbuilder-build
        name: Build configured book
        launch_type: command
        executable: bookbuilder
        arguments: [build]
        working_directory: ''
        env_names: []
        health_type: none
        is_primary: true
        enabled: false
        verified: false
        verification_note: >-
          Verified CLI shape (bookbuilder build --config PATH), but each book
          needs its own working directory and config. Configure deliberately;
          builds overwrite publishing artifacts.
        shutdown_behavior: wait
    source: default

  - id: worker
    name: Worker
    description: Thin gateway to the OpenCode applied-AI runtime.
    category: execution
    icon: "Wk"
    tags: [execution, gateway, opencode]
    enabled: true
    pinned: true
    display_order: 70
    repository_path: 'C:\Projects\worker'
    documentation_paths:
      - 'C:\Projects\worker\README.md'
    integration:
      adapter: worker
      enabled: true
      config:
        base_url: http://127.0.0.1:7317
        timeout_seconds: 2
    relationships:
      projects: [language, inference, math]
      outcomes: [ai-business]
    control_policy:
      allow_launch: true
      confirmation_required: true
    launch_definitions:
      - id: worker-serve
        name: Worker server
        launch_type: server
        executable: bun
        arguments: [src/cli/cli.ts, serve]
        working_directory: 'C:\Projects\worker'
        env_names: []
        browser_url: http://127.0.0.1:7317/
        health_type: http
        health_url: http://127.0.0.1:7317/health
        expected_port: 7317
        is_primary: true
        enabled: false
        verified: false
        verification_note: >-
          Documented as `bun src/cli/cli.ts serve`. Not launched during
          acceptance because it can execute model work and may incur cost.
        shutdown_behavior: terminate
    source: default

