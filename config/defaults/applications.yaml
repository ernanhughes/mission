# Shipped application defaults.
#
# These are inserted only when an application ID does not already exist.
# Edits in Mission Control are stored in SQLite and always win over this file.
# A launch definition marked enabled: false is deliberately not actionable
# until a person verifies it.

applications:
  - id: next
    name: Next
    description: Research discovery, experiments, evidence and directions worth pursuing next.
    category: research
    icon: "N"
    tags: [research, discovery, evidence]
    enabled: true
    pinned: true
    display_order: 10
    repository_path: 'C:\Projects\next'
    documentation_paths:
      - 'C:\Projects\next\docs'
    integration:
      adapter: next
      enabled: true
      config:
        database_path: 'C:\Projects\next\data\next.db'
        limit: 8
    relationships:
      projects: [language, inference, math]
      outcomes: [books, ai-business]
    control_policy:
      allow_launch: true
      confirmation_required: false
    launch_definitions: []
    source: default

  - id: cocoder
    name: CoCoder
    description: Evidence-backed cold review of code changes.
    category: quality
    icon: "C"
    tags: [code-review, verification, quality]
    enabled: true
    pinned: true
    display_order: 20
    repository_path: 'C:\Projects\cocoder'
    documentation_paths:
      - 'C:\Projects\cocoder\README.md'
    integration:
      adapter: cocoder
      enabled: true
      config:
        review_json_path: ''
    relationships:
      projects: [language, math, inference]
      outcomes: [books, ai-business]
    control_policy:
      allow_launch: true
      confirmation_required: false
    launch_definitions:
      - id: cocoder-review-artifact
        name: Review a repository (CLI)
        launch_type: none
        arguments: []
        env_names: []
        health_type: none
        is_primary: true
        enabled: false
        verified: false
        verification_note: >-
          The CLI is verified (cocoder review --format json --output FILE), but
          a repository, base and head must be chosen before a launch is meaningful.
          Configure a bounded review command rather than a generic launcher.
    source: default

  - id: work
    name: Work
    description: Commercial opportunities, qualification, pursuit readiness and income outcomes.
    category: commercial
    icon: "W"
    tags: [income, opportunities, clients, employment]
    enabled: true
    pinned: true
    display_order: 30
    repository_path: 'C:\Projects\work'
    documentation_paths:
      - 'C:\Projects\work\README.md'
      - 'C:\Projects\work\docs\USAGE.md'
    integration:
      adapter: work
      enabled: false
      config: {}
    relationships:
      projects: [language, inference, math]
      outcomes: [ai-business, programmer-ie]
    control_policy:
      allow_launch: true
      confirmation_required: false
    launch_definitions:
      - id: work-dashboard
        name: Work web dashboard
        launch_type: server
        executable: work
        arguments: [web, --host, 127.0.0.1, --port, '8765']
        working_directory: 'C:\Projects\work'
        env_names: [WORK_DATABASE_URL]
        browser_url: http://127.0.0.1:8765/
        health_type: http
        health_url: http://127.0.0.1:8765/
        expected_port: 8765
        is_primary: true
        enabled: false
        verified: false
        verification_note: >-
          Documented command, but not verified on this machine. Requires an
          installed Work CLI, PostgreSQL and WORK_DATABASE_URL. No credentials
          are stored by Mission Control.
        shutdown_behavior: terminate
    source: default

